# Release-artifact flow for the trino-duckbridge connector.
#
# Trigger: push to a release branch. Two spellings are accepted:
#     release-<version>    e.g. release-483-0.1.0
#     release/<version>    e.g. release/483-0.1.0
# The release version is the branch suffix: 483-0.1.0 (<trino-major>-<semver>, so the Trino ABI is
# legible). Passed verbatim to Gradle's -Pversion (:trino-duckbridge honors it, else its dev default
# 483-0.1.0-SNAPSHOT). The git tag is v<version> (v483-0.1.0). Release assets ship as BOTH archive
# formats, each with a sha256 sidecar (matching the sibling trino-doris-connector convention):
#     trino-duckbridge-v483-0.1.0.tar.gz  + .tar.gz.sha256
#     trino-duckbridge-v483-0.1.0.zip     + .zip.sha256
#
# Scope: :trino-duckbridge ONLY (the doris module is not release-ready). This runs the SAME
# build+test gate as ci.yml FIRST; the assemble/package/release steps only run on success, so a red
# build produces no artifact and no release.
name: Release

on:
  push:
    branches:
      - 'release-*'
      - 'release/*'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write  # gh release create pushes a tag + uploads assets

jobs:
  release:
    name: gated build + plugin release (:trino-duckbridge)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history for release-notes generation

      # release-483-0.1.0 -> 483-0.1.0  |  release/483-0.1.0 -> 483-0.1.0
      - name: Derive release version
        id: version
        run: |
          set -euo pipefail
          branch="${GITHUB_REF_NAME}"
          version="${branch#release-}"
          version="${version#release/}"
          if [ -z "${version}" ] || [ "${version}" = "${branch}" ]; then
            echo "::error::could not derive version from branch '${branch}'"
            exit 1
          fi
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "tag=v${version}" >> "${GITHUB_OUTPUT}"
          echo "Release version: ${version} (tag v${version})"

      - name: Free up disk space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: false
          swap-storage: false

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Fetch trino_parity extension (community)
        run: ./.github/scripts/fetch-parity-extension.sh

      # GATE: same full build + tests as CI, with the release version wired in via -Pversion. If
      # this fails, no later step runs -> no artifact, no release.
      - name: Build + test gate (release version)
        run: ./gradlew :trino-duckbridge:build --no-daemon -Pversion=${{ steps.version.outputs.version }}

      # Re-assemble + re-run the assembly guard at the release version so the produced dir is
      # trino-duckbridge-<version>/.
      - name: Assemble + verify plugin
        run: >-
          ./gradlew :trino-duckbridge:pluginAssemble :trino-duckbridge:verifyPluginAssembly
          --no-daemon -Pversion=${{ steps.version.outputs.version }}

      # Package BOTH .tar.gz and .zip, each with a .sha256 sidecar, named with the v-prefixed tag.
      # Archives extract to trino-duckbridge-v<version>/ (drop into $TRINO_HOME/plugin/).
      - name: Package plugin archives
        id: package
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.version }}"   # e.g. 483-0.1.0
          tag="${{ steps.version.outputs.tag }}"           # e.g. v483-0.1.0
          src="trino-duckbridge/build/trino-plugin/trino-duckbridge-${version}"
          test -d "${src}" || { echo "::error::missing ${src}"; exit 1; }
          base="trino-duckbridge-${tag}"                   # trino-duckbridge-v483-0.1.0
          staging="build/release-staging"
          rm -rf "${staging}" && mkdir -p "${staging}"
          cp -r "${src}" "${staging}/${base}"
          ( cd "${staging}" && zip -r -q "${GITHUB_WORKSPACE}/${base}.zip" "${base}" )
          ( cd "${staging}" && tar -czf "${GITHUB_WORKSPACE}/${base}.tar.gz" "${base}" )
          ( cd "${GITHUB_WORKSPACE}" \
              && sha256sum "${base}.zip"    > "${base}.zip.sha256" \
              && sha256sum "${base}.tar.gz" > "${base}.tar.gz.sha256" )
          echo "base=${base}" >> "${GITHUB_OUTPUT}"
          echo "Packaged:"; ls -la "${GITHUB_WORKSPACE}/${base}".*

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          gh release create "${{ steps.version.outputs.tag }}"
          "${{ steps.package.outputs.base }}.tar.gz"
          "${{ steps.package.outputs.base }}.tar.gz.sha256"
          "${{ steps.package.outputs.base }}.zip"
          "${{ steps.package.outputs.base }}.zip.sha256"
          --title "${{ steps.version.outputs.tag }}"
          --target "${GITHUB_SHA}"
          --generate-notes

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            trino-duckbridge/build/reports/tests/
            trino-duckbridge/build/test-results/
          if-no-files-found: ignore
          retention-days: 14
